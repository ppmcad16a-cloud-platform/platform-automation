# Shared settings for all playbooks.

# The platform repos (the same Windows folder, seen from WSL).
repos_root: /mnt/c/Users/dell/Documents/HeroVired/Capstone/repos

# Tool versions - the SAME as on the Windows side and in the Jenkins agents.
# Each one was at least 14 days old when pinned; bump on purpose, in a PR.
tool_versions:
  terraform: 1.16.6
  kubectl: 1.36.1
  helm: 4.3.0
  kubelogin: 0.2.21
  awscli: 2.38.1
  azure_cli: 2.91.0-1~noble
  gcloud: 588.0.0-0

# AWS publishes no checksum file for the CLI zip - fingerprint taken when pinned.
awscli_sha256: b11ed416d91f4251da363a17706938eeaf0e520745754c104c0c1890dd8363c7

# Every binary goes into its own versioned folder under /opt/tools and is
# linked into /usr/local/bin: re-running changes nothing, and a version bump
# is just a new folder + a new link.
tools_dir: /opt/tools

# ---------- used by preflight / up / down
azure_subscription_id: 9c0602c2-72a4-4432-a192-7abf998e2b60
aws_account_id: "722867460821"

# Environment for every Terraform / CLI step.
tf_env:
  AWS_PROFILE: HeroviredProfile
  TF_IN_AUTOMATION: "1"   # shorter output, no "run terraform apply next" hints
  TF_INPUT: "0"           # never stop to ask a question
  TF_PLUGIN_CACHE_DIR: "{{ lookup('env', 'HOME') }}/.terraform.d/plugin-cache"

# What may NOT be left behind after an add-ons destroy, per cloud. Each
# command must print nothing; down.yml waits up to 5 minutes, then stops
# BEFORE destroying the cluster (so Kubernetes can still clean up).
leftover_checks:
  aws:
    - what: load balancers made by the AWS LB controller
      cmd: aws elbv2 describe-load-balancers --region ap-south-1 --query "LoadBalancers[?starts_with(LoadBalancerName, 'k8s-')].LoadBalancerName" --output text
    - what: disks made by the EBS driver (Prometheus, Loki)
      cmd: aws ec2 describe-volumes --region ap-south-1 --filters Name=status,Values=available Name=tag-key,Values=kubernetes.io/created-for/pvc/name --query "Volumes[].VolumeId" --output text
  gcp:
    - what: disks made for Prometheus / Loki
      cmd: gcloud compute disks list --project project-899ced78-a554-40c2-96c --filter="name~^pvc-" --format="value(name)"
    - what: load balancers made for the gateway
      cmd: gcloud compute forwarding-rules list --project project-899ced78-a554-40c2-96c --format="value(name)"
  azure: [] # AKS deletes its disks and load balancer together with the cluster

# ---------- used by up.yml
azure_tenant_id: 0fd463ca-1b22-4674-bea5-699c2e0ad98b
domain: rishavmukhopadhyay.store

# kubectl access after a cluster is (re)created - its old entry is stale.
get_credentials:
  gcp:
    - gcloud container clusters get-credentials prod-gke --zone asia-south1-a --project project-899ced78-a554-40c2-96c
  azure:
    - az aks get-credentials --resource-group rg-prod-cluster --name prod-aks --overwrite-existing
    - kubelogin convert-kubeconfig -l azurecli
  aws:
    - aws eks update-kubeconfig --name prod-eks --region ap-south-1 --profile HeroviredProfile

# Third-party images AKS pulls from OUR registry (ghcr.io stalls in Azure
# Central India). up.yml copies any that are missing (az acr import).
acr_name: acrmern0botwx
acr_mirrors:
  - { source: "ghcr.io/external-secrets/external-secrets:v2.12.0", repo: external-secrets/external-secrets, tag: v2.12.0 }
  - { source: "ghcr.io/opencost/opencost:1.121.3", repo: opencost/opencost, tag: 1.121.3 }
  - { source: "ghcr.io/opencost/opencost-ui:1.121.3", repo: opencost/opencost-ui, tag: 1.121.3 }

# The shop: services in install order, and which image tag each one runs
# (same file the manual runbook used; CI tags look like main-a1b2c3d).
image_tags_file: /mnt/c/Users/dell/image-tags.json
shop_services:
  - identity-service
  - catalog-service
  - commerce-service
  - notification-service
  - api-gateway-service
  - client-service

# ---------- stopped-standby failover (GCP primary; Azure, AWS sleep)
# Like a stopped EC2 instance: fully configured, machines off, cheap -
# and much faster to start (3-10 min) than to build (20-40 min).
primary_cloud: gcp
standby:
  azure:
    # Running | Stopped
    state_cmd: az aks show --resource-group rg-prod-cluster --name prod-aks --query powerState.code --output tsv
    asleep_when: Stopped
    sleep:
      - az aks stop --resource-group rg-prod-cluster --name prod-aks
    wake:
      - az aks start --resource-group rg-prod-cluster --name prod-aks
  aws:
    # desired number of nodes: 2 awake, 0 asleep (the EKS control plane keeps running)
    state_cmd: aws eks describe-nodegroup --cluster-name prod-eks --nodegroup-name default --region ap-south-1 --query nodegroup.scalingConfig.desiredSize --output text
    asleep_when: "0"
    sleep:
      - aws eks update-nodegroup-config --cluster-name prod-eks --nodegroup-name default --region ap-south-1 --scaling-config minSize=0,maxSize=3,desiredSize=0
      - aws eks wait nodegroup-active --cluster-name prod-eks --nodegroup-name default --region ap-south-1
    wake:
      - aws eks update-nodegroup-config --cluster-name prod-eks --nodegroup-name default --region ap-south-1 --scaling-config minSize=2,maxSize=3,desiredSize=2
      - aws eks wait nodegroup-active --cluster-name prod-eks --nodegroup-name default --region ap-south-1
