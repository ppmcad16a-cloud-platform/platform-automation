# Start of a session - one command, as parallel as the clouds allow:
#   preflight -> image mirrors
#   -> ALL THREE clusters at the same time (the GKE egress IP lives in GCP's
#      foundation stack, so AKS and EKS no longer wait for GKE)
#   -> global layer (DNS, pools, Atlas allow-list - it needs every cluster's IPs)
#   -> then EACH cloud on its own, without waiting for the others:
#        add-ons -> the shop (all 6 services at once) -> health check
#        -> Azure / AWS go to sleep (stopped standbys; GCP serves everyone)
# Every Terraform step is guarded (tasks/tf-apply.yml): it may only create or
# update - a plan that would delete or replace anything stops the run.
#
# Run (WSL Ubuntu, in this repo):  ansible-playbook playbooks/up.yml
#   -e keep_awake=true   keep the standbys running at the end
# Takes about 30-40 minutes (the slowest cloud decides). Safe to re-run after
# a failure: finished steps show "nothing to change".
- name: Preflight
  ansible.builtin.import_playbook: preflight.yml

- name: Image mirrors - AKS pulls these from our ACR (ghcr.io stalls in Azure)
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Is the image already in ACR?
      ansible.builtin.command: >-
        az acr repository show-tags --name {{ acr_name }} --repository {{ item.repo }} --output tsv
      loop: "{{ acr_mirrors }}"
      loop_control:
        label: "{{ item.repo }}:{{ item.tag }}"
      register: mirror
      changed_when: false
      failed_when: false
    - name: Copy the missing ones (Azure copies server-side)
      ansible.builtin.command: >-
        az acr import --name {{ acr_name }} --source {{ item.item.source }} --image {{ item.item.repo }}:{{ item.item.tag }}
      loop: "{{ mirror.results }}"
      loop_control:
        label: "{{ item.item.repo }}:{{ item.item.tag }}"
      when: item.item.tag not in item.stdout_lines
      changed_when: true

- name: All three clusters at the same time
  hosts: clouds
  gather_facts: false
  environment: "{{ tf_env }}"
  tasks:
    - name: Cluster -> kubectl access -> nodes Ready
      ansible.builtin.include_tasks: tasks/cluster-up.yml

- name: Global layer - DNS, load balancer pools, Atlas allow-list for the clusters
  hosts: localhost
  gather_facts: false
  environment: "{{ tf_env | combine(global_secrets_env) }}"
  tasks:
    - name: Guarded apply (create / update only)
      ansible.builtin.include_tasks: tasks/tf-apply.yml
      vars:
        tf_dir: "{{ repos_root }}/global-platform"
        tf_label: global
        allowed_actions: [create, update]

- name: Each cloud on its own - add-ons, the shop, health, standbys sleep
  hosts: clouds
  gather_facts: false
  strategy: free # a fast cloud never waits for a slower one
  environment: "{{ tf_env }}"
  vars:
    image_tags: "{{ lookup('ansible.builtin.file', image_tags_file) | from_json }}"
  tasks:
    - name: Add-ons (guarded - create / update only)
      ansible.builtin.include_tasks: tasks/tf-apply.yml
      vars:
        tf_dir: "{{ repos_root }}/{{ inventory_hostname }}-platform/environments/prod/addons"
        tf_label: "{{ inventory_hostname }}/addons"
        allowed_actions: [create, update]

    - name: The shop - all 6 services at once
      ansible.builtin.include_tasks: tasks/install-shop.yml
      vars:
        shop_install_services: "{{ shop_services }}"
        shop_install_tags: "{{ image_tags }}"

    - name: Health check - https://<cloud>.<domain>/api/health answers 200
      ansible.builtin.uri:
        url: "https://{{ inventory_hostname }}.{{ domain }}/api/health"
      register: health
      until: health.status == 200
      retries: 20
      delay: 15

    - name: Standbys go to sleep (skip with -e keep_awake=true)
      ansible.builtin.include_tasks: tasks/sleep-cloud.yml
      when:
        - inventory_hostname in standby
        - not (keep_awake | default(false) | bool)

- name: Ready
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Where everything is
      ansible.builtin.debug:
        msg:
          - "Shop:    https://{{ domain }}  (gcp. / azure. / aws. for one cloud)"
          - "Jenkins: https://jenkins.{{ domain }}   password: cd gcp-platform/environments/prod/addons; terraform output -raw jenkins_admin_password"
          - "Grafana: https://grafana.{{ domain }}   password: cd gcp-platform/environments/prod/addons; terraform output -raw grafana_admin_password"
          - "End of session: ansible-playbook playbooks/down.yml"
