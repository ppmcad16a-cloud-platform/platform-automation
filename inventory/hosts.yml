# Every cloud is one "host". Nothing is reached over SSH: all work runs on
# this machine (connection: local) and talks to the clouds through their
# CLIs, Terraform and Helm - a host is just a bundle of per-cloud settings.
all:
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  children:
    clouds:
      hosts:
        gcp:
          kube_context: gke_project-899ced78-a554-40c2-96c_asia-south1-a_prod-gke
        azure:
          kube_context: prod-aks
        aws:
          kube_context: arn:aws:eks:ap-south-1:722867460821:cluster/prod-eks
