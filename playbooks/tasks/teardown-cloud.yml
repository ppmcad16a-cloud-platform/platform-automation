# Tear down ONE cloud (the current inventory host: gcp, azure or aws).
# Each step is checked before the next one may run.
- name: "{{ inventory_hostname }} | stack folders"
  ansible.builtin.set_fact:
    stack_root: "{{ repos_root }}/{{ inventory_hostname }}-platform/environments/prod"

- name: "{{ inventory_hostname }} | terraform init (add-ons + cluster stacks)"
  ansible.builtin.command:
    cmd: terraform init -input=false -no-color
    chdir: "{{ stack_root }}/{{ item }}"
  loop: [addons, cluster]
  changed_when: false

# ---------- 1. add-ons
- name: "{{ inventory_hostname }} | add-ons: anything installed?"
  ansible.builtin.command:
    cmd: terraform state list
    chdir: "{{ stack_root }}/addons"
  register: addons_before
  changed_when: false

- name: "{{ inventory_hostname }} | add-ons: terraform destroy (takes several minutes)"
  ansible.builtin.command:
    cmd: terraform destroy -auto-approve -input=false -no-color
    chdir: "{{ stack_root }}/addons"
  when: addons_before.stdout | trim | length > 0
  changed_when: true

- name: "{{ inventory_hostname }} | add-ons: the state MUST now be empty"
  ansible.builtin.command:
    cmd: terraform state list
    chdir: "{{ stack_root }}/addons"
  register: addons_after
  changed_when: false
  failed_when: addons_after.stdout | trim | length > 0

# ---------- 2. leftovers (load balancers / disks the add-ons created)
- name: "{{ inventory_hostname }} | leftover check"
  block:
    - name: "{{ inventory_hostname }} | leftover check (waits up to 5 minutes)"
      ansible.builtin.command: "{{ item.cmd }}"
      loop: "{{ leftover_checks[inventory_hostname] }}"
      loop_control:
        label: "{{ item.what }}"
      register: leftovers
      until: leftovers.stdout | trim | length == 0
      retries: 20
      delay: 15
      changed_when: false
  rescue:
    - name: "{{ inventory_hostname }} | STOP - the cluster was NOT destroyed"
      ansible.builtin.fail:
        msg: >-
          Something the add-ons created is still there
          ({{ leftovers.results | default([]) | selectattr('stdout', 'defined') | map(attribute='stdout') | select | join(' / ') }}).
          The cluster is kept running so Kubernetes can still clean it up.
          Wait a few minutes and re-run down.yml, or delete it by hand (docs: runbooks).

# ---------- 3. cluster
- name: "{{ inventory_hostname }} | cluster: terraform destroy (takes 5-15 minutes)"
  ansible.builtin.command:
    cmd: terraform destroy -auto-approve -input=false -no-color
    chdir: "{{ stack_root }}/cluster"
  changed_when: true

- name: "{{ inventory_hostname }} | cluster: the state MUST now be empty"
  ansible.builtin.command:
    cmd: terraform state list
    chdir: "{{ stack_root }}/cluster"
  register: cluster_after
  changed_when: false
  failed_when: cluster_after.stdout | trim | length > 0
