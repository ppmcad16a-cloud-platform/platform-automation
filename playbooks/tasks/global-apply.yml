# global-platform: plan -> check WHAT the plan does -> apply exactly that plan.
# allowed_actions: what the plan may do, e.g. [delete] at the end of a
# session. Anything else (e.g. replacing the origin certificate) stops here.
- name: global | stack folder
  ansible.builtin.set_fact:
    global_root: "{{ repos_root }}/global-platform"

- name: global | terraform init
  ansible.builtin.command:
    cmd: terraform init -input=false -no-color
    chdir: "{{ global_root }}"
  changed_when: false

- name: global | terraform plan
  ansible.builtin.command:
    cmd: terraform plan -input=false -no-color -out=ansible.tfplan
    chdir: "{{ global_root }}"
  changed_when: false

- name: global | read the plan
  ansible.builtin.command:
    cmd: terraform show -json ansible.tfplan
    chdir: "{{ global_root }}"
  register: plan_json
  changed_when: false
  no_log: true # the JSON contains secret values

- name: global | what would change
  ansible.builtin.set_fact:
    planned: >-
      {{ (plan_json.stdout | from_json).resource_changes | default([])
         | rejectattr('change.actions', 'equalto', ['no-op'])
         | rejectattr('change.actions', 'equalto', ['read'])
         | map(attribute='address')
         | zip((plan_json.stdout | from_json).resource_changes | default([])
               | rejectattr('change.actions', 'equalto', ['no-op'])
               | rejectattr('change.actions', 'equalto', ['read'])
               | map(attribute='change.actions'))
         | list }}

- name: global | show it
  ansible.builtin.debug:
    msg: "{{ planned | map('join', ' -> ') | list if planned else 'nothing to change' }}"

- name: "global | the plan may only: {{ allowed_actions | join(', ') }}"
  ansible.builtin.assert:
    that: planned | map('last') | flatten | difference(allowed_actions) | length == 0
    fail_msg: >-
      The global plan wants to do more than {{ allowed_actions | join('/') }} (see above).
      Stopping - review it by hand: cd global-platform; terraform plan
    quiet: true

- name: global | terraform apply (exactly the plan above)
  ansible.builtin.command:
    cmd: terraform apply -input=false -no-color ansible.tfplan
    chdir: "{{ global_root }}"
  when: planned | length > 0
  changed_when: true

- name: global | remove the plan file
  ansible.builtin.file:
    path: "{{ global_root }}/ansible.tfplan"
    state: absent
