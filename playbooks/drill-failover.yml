# Failover drill: take ONE cloud's front door away and prove that
#   1. the shop (https://<domain>) keeps answering - Cloudflare moves traffic
#      to the other clouds within about a minute (health check every 60 s),
#   2. the alert fires (MernServiceDown in that cloud's Alertmanager -> Slack),
#   3. the cloud comes back healthy afterwards.
# The gateway is ALWAYS scaled back, even if a check fails.
#
# Run:  ansible-playbook playbooks/drill-failover.yml -e drill_cloud=azure   (gcp | azure | aws)
- name: "Failover drill - take {{ drill_cloud | default('azure') }} out for {{ drill_minutes | default(5) }} minutes"
  hosts: "{{ drill_cloud | default('azure') }}"
  gather_facts: false
  environment: "{{ tf_env }}"
  vars:
    minutes: "{{ drill_minutes | default(5) | int }}"
    probe_every: 10 # seconds
    # Cloudflare needs up to ~60-90 s to notice; failures before that are
    # expected and only reported, failures AFTER it fail the drill.
    grace_probes: 12 # = 120 s
    shop_url: "https://{{ domain }}/api/health"
    cloud_url: "https://{{ inventory_hostname }}.{{ domain }}/api/health"
  tasks:
    - name: Before - shop and {{ inventory_hostname }} are healthy
      ansible.builtin.uri:
        url: "{{ item }}"
      loop: ["{{ shop_url }}", "{{ cloud_url }}"]

    - name: Remember how many gateway pods {{ inventory_hostname }} runs
      ansible.builtin.command: >-
        kubectl --context {{ kube_context }} -n mern get deploy api-gateway-service -o jsonpath={.spec.replicas}
      register: replicas_before
      changed_when: false

    - name: The drill (always restores the gateway)
      block:
        - name: "{{ inventory_hostname }} | scale the gateway to 0 (the cloud's front door closes)"
          ansible.builtin.command: >-
            kubectl --context {{ kube_context }} -n mern scale deploy api-gateway-service --replicas=0
          changed_when: true

        - name: "Probe the shop every {{ probe_every }} s for {{ minutes }} minutes"
          ansible.builtin.uri:
            url: "{{ shop_url }}"
            timeout: 8
          register: probes
          failed_when: false
          loop: "{{ range(0, (minutes | int) * 60 // probe_every) | list }}"
          loop_control:
            pause: "{{ probe_every }}"
            label: "probe {{ item }}"

        - name: "{{ inventory_hostname }} | does Alertmanager have MernServiceDown firing?"
          ansible.builtin.command: >-
            kubectl --context {{ kube_context }} -n monitoring get --raw
            /api/v1/namespaces/monitoring/services/kps-alertmanager:9093/proxy/api/v2/alerts
          register: alerts
          changed_when: false

        - name: Results
          ansible.builtin.set_fact:
            failed_early: "{{ probes.results[:grace_probes] | rejectattr('status', 'equalto', 200) | list | length }}"
            failed_late: "{{ probes.results[grace_probes:] | rejectattr('status', 'equalto', 200) | list | length }}"
            alert_fired: >-
              {{ alerts.stdout | from_json
                 | selectattr('labels.alertname', 'equalto', 'MernServiceDown')
                 | selectattr('labels.deployment', 'equalto', 'api-gateway-service')
                 | list | length > 0 }}
      always:
        - name: "{{ inventory_hostname }} | scale the gateway back to {{ replicas_before.stdout }}"
          ansible.builtin.command: >-
            kubectl --context {{ kube_context }} -n mern scale deploy api-gateway-service --replicas={{ replicas_before.stdout }}
          changed_when: true

    - name: After - {{ inventory_hostname }} is healthy again
      ansible.builtin.uri:
        url: "{{ cloud_url }}"
      register: back
      until: back.status == 200
      retries: 30
      delay: 10

    - name: Drill report
      ansible.builtin.debug:
        msg:
          - "Shop probes: {{ probes.results | length }} in {{ minutes }} min"
          - "Failed in the first {{ grace_probes * probe_every }} s (Cloudflare still detecting): {{ failed_early }}"
          - "Failed after that (must be 0): {{ failed_late }}"
          - "MernServiceDown firing in {{ inventory_hostname }}: {{ alert_fired }}"

    - name: The drill passed
      ansible.builtin.assert:
        that:
          - failed_late | int == 0
          - alert_fired | bool
        fail_msg: >-
          Failover drill FAILED: {{ failed_late }} failed requests after the grace period,
          alert fired = {{ alert_fired }}.
        success_msg: "Failover drill PASSED for {{ inventory_hostname }}"
